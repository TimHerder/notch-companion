name: Recover runner allocation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: runner-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.repository == 'TimHerder/notch-companion' &&
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      checks: read
      pull-requests: read
    steps:
      # workflow_run's SHA is trusted default-branch code, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retry only a confirmed ARM allocation failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci-runner.py recover
